[package]
name = "rikka-paste"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rikka_paste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
mdns-sd = "0.21.4"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
sha2 = "0.11.0"
rand = "0.10.3"
gethostname = "1.1.0"


# debug 构建下 argon2 太慢（64 MiB 派生要好几秒），单独开优化
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# 图片可达几十 MB，debug 构建下加解密和 PNG 编解码同样需要优化
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = "0.3.2"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
